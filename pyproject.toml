[project]
name = "munich-flat-agent"
version = "0.1.0"
description = "A private, persistent Munich rental-search assistant built with LangChain, LangGraph and Ollama Cloud."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.7,<3",
  "langchain>=1,<2",
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=2,<4",
  "langchain-ollama>=1,<2",
  "httpx>=0.28,<1"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
flat-agent = "flat_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["flat_agent"]
