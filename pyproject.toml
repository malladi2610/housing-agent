[project]
name = "homeward"
version = "0.3.0"
description = "Lean Munich flat hunter: polls Flatsforfriendz + WG-Gesucht, ranks by distance to work, applies automatically."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "playwright>=1.48",
  "uiautomator2>=3.2",
]

[project.scripts]
homeward = "homeward.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["homeward"]
