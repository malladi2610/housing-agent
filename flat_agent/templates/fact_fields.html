<div class="form-grid">
  <label>Accommodation<select name="home_type">{% for value,label in [('unknown','Not yet known'),('studio','Studio / whole flat'),('shared','Shared accommodation / WG')] %}<option value="{{ value }}" {% if d.get('home_type','unknown')==value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
  <label>Area<input name="area" value="{{ d.get('area','') }}" placeholder="e.g. Moosach"></label>
  <label class="full">Address, if known<input name="address" value="{{ d.get('address','') }}" placeholder="No location is inferred from the title"></label>
  <label>Warm rent (€ / month)<input type="number" name="warm_rent" step="0.01" min="0" value="{{ d.get('warm_rent') if d.get('warm_rent') is not none else '' }}"></label>
  <label>Electricity (€ / month)<input type="number" name="electricity" step="0.01" min="0" value="{{ d.get('electricity') if d.get('electricity') is not none else '' }}" placeholder="0 only if included"></label>
  <label>Internet (€ / month)<input type="number" name="internet" step="0.01" min="0" value="{{ d.get('internet') if d.get('internet') is not none else '' }}" placeholder="0 only if included"></label>
  <label>Other required monthly costs (€)<input type="number" name="other_monthly" step="0.01" min="0" value="{{ d.get('other_monthly') if d.get('other_monthly') is not none else '' }}" placeholder="0 only when verified"></label>
  <label class="full">Or, an explicitly quoted all-in monthly price (€)<input type="number" name="all_in_rent" step="0.01" min="0" value="{{ d.get('all_in_rent') if d.get('all_in_rent') is not none else '' }}"><small>This overrides the component total. Leave empty unless every recurring cost is included.</small></label>
  <label class="check full"><input type="checkbox" name="all_costs_confirmed" {% if d.get('all_costs_confirmed') %}checked{% endif %}><span>I have verified the total includes electricity, internet and all required recurring costs.</span></label>
  <label>Available from<input type="date" name="available_from" value="{{ d.get('available_from') or '' }}"></label>
  <label>Lease end, if limited<input type="date" name="available_until" value="{{ d.get('available_until') or '' }}"></label>
  <label class="check full"><input type="checkbox" name="move_in_confirmed" {% if d.get('move_in_confirmed') %}checked{% endif %}><span>The actual tenancy start works for my move-in window, including any earlier rent liability.</span></label>
  <label>Distance to MTZ (km)<input type="number" name="distance_km" min="0" step="0.1" value="{{ d.get('distance_km') if d.get('distance_km') is not none else '' }}"></label>
  <label>How was distance checked?<select name="distance_basis">{% for value,label in [('unknown','Not verified'),('straight_line','Straight-line distance'),('route','Verified route distance')] %}<option value="{{ value }}" {% if d.get('distance_basis','unknown')==value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
  <label>Cycling time (minutes)<input type="number" name="cycling_minutes" min="0" value="{{ d.get('cycling_minutes') if d.get('cycling_minutes') is not none else '' }}"></label>
  <label>Public transport time (minutes)<input type="number" name="transit_minutes" min="0" value="{{ d.get('transit_minutes') if d.get('transit_minutes') is not none else '' }}"></label>
  <label class="full">Commute evidence or route notes<input name="commute_evidence" value="{{ d.get('commute_evidence','') }}" placeholder="Route source, checked time, walking/transfers included…"><small>Travel estimates are entered from a routing source. This release does not calculate live public transport routes.</small></label>
  <label class="full">Advertiser name<input name="contact_name" value="{{ d.get('contact_name','') }}"></label>
</div>
